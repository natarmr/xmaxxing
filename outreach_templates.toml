# Outreach wording.
#
# {headline} and {portfolio} are filled from [profile] in config.toml, not from
# this file. Anything you set here for those names is ignored.
#
# Available slots: {role} {company} {name} {author} {their_requirement}
#                  {product_line} {proof} {headline} {portfolio}
#
# A line whose slots all resolve to empty is dropped from the draft, so an
# unknown role or company degrades to "the role opening" rather than leaving a
# visible {placeholder}.

[reply_post]
use_when = "post asks for comments, replies or a portfolio"
text = """
Interested in the {role} opening - I'm a {headline} building in Python and LLM land: an open-source agentic harness, a multi-agent vision pipeline, and shipped fine-tuned models.

Portfolio: {portfolio}
"""

[dm_recruiter]
use_when = "post invites DMs"
text = """
Hi {author} - saw your {role} opening. I'm a {headline}: Python, PyTorch, RAG and agentic systems, model fine-tuning and eval, plus real systems work in C.

Some things I've shipped: {proof}

Portfolio and resume: {portfolio}

Open to a 15-minute call this week?
"""

# --- not selected by the CLI yet ---
# build_draft picks only `dm_recruiter` (action == "dm") or `reply_post`
# (everything else). The two templates below are kept as written material and
# are not rendered by any current code path, so editing them changes nothing.
# Wire them up before expecting an effect.

[dm_founder]
use_when = "small team or stealth startup, no recruiter in the thread"
text = """
Hey - I build in Python/LLM land: a retrieval service with an eval set I measured, an agent harness that runs locally against open models, a vision inference service over batched images, and a from-scratch crypto implementation in C.

{product_line} is the kind of problem I want to poke at.

Portfolio: {portfolio}

Worth 15 minutes?
"""

[follow_up]
use_when = "no reply after a few days, sent a DM only"
text = """
Following up on my note about the {role} role. Happy to send anything specific - work samples, code, or a short write-up on how I'd approach it.
"""