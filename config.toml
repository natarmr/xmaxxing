[[scoring.negative]]
name = "product_promo"
weight = 3
patterns = [
  '\bpre[- ]?launch\b',
  '\bproduct hunt\b',
  '\baffiliate\b',
  '\buse code\b',
  '\bdiscount code\b',
  '\bblack friday\b',
  '\bsale (?:is )?live\b',
  '\bbuilt with\b',
  '\bcome build with us\b',
  '\bcontributors welcome\b',
  '\bopen source announcement\b',
  '\bintroducing\b',
  '\bintroduces\b',
  '\bwe(?:\W?ve| have) (?:just )?built\b',
]

[[scoring.negative]]
name = "gambling_spam"
weight = 4
patterns = [
  '\bbetting\b',
  '\bgambling\b',
  '\bcasino\b',
  '\bsportsbook\b',
  '\bwager(?:s|ing)?\b',
  '\bodds\b',
  '\bprediction market',
