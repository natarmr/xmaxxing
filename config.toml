[queries]
enabled = true
default_max_pages = 3

[[queries.items]]
name = "ai-ml-hiring"
max_pages = 4
q = '("hiring" OR "we are hiring" OR "job opening" OR "open role") ("AI engineer" OR "ML engineer" OR "machine learning" OR "AI intern" OR "ML intern") (apply OR "DM me" OR "link in replies" OR "comment") lang:en -filter:replies min_faves:2'

[[queries.items]]
name = "ai-intern-fresher"
max_pages = 4
q = '(internship OR intern OR trainee OR fresher OR "graduate engineer") ("AI" OR "ML" OR "agentic" OR "LLM" OR software) (hiring OR apply OR stipend) lang:en -filter:replies'

[[queries.items]]
name = "agentic-llm"
max_pages = 3
q = '("agentic" OR "AI agent" OR "LLM" OR "generative AI" OR "GenAI") (hiring OR intern OR "we are building" OR "join us") (apply OR "DM me" OR "link in replies") lang:en -filter:replies min_faves:2'

[[queries.items]]
name = "hackathons"
max_pages = 3
q = '(hackathon OR buildathon OR ideathon OR datathon) (register OR apply OR submit OR prize OR deadline OR "registration open") lang:en -filter:replies min_faves:2'

[[queries.items]]
name = "research-assistant"
max_pages = 2
q = '("research assistant" OR "research intern" OR "research engineer") (hiring OR apply OR "open to" OR "DM me") lang:en -filter:replies'

[[queries.items]]
name = "software-fresher-india"
max_pages = 3
q = '(hiring OR "we are hiring") (fresher OR "graduate engineer" OR "entry level") (Bangalore OR Hyderabad OR Delhi OR Mumbai OR Pune OR Chennai OR remote) (apply OR "DM me") lang:en -filter:replies min_faves:2'

[[queries.items]]
name = "apply-links"
max_pages = 3
q = '("is hiring" OR "we are hiring" OR "job opening") (intern OR engineer OR "graduate engineer") filter:links lang:en -filter:replies min_faves:1'

[selectors]
tweet = 'article[data-testid="tweet"]'
tweet_text = '[data-testid="tweetText"]'
show_more_text = '[data-testid="tweet-text-show-more-link"]'
user_name = '[data-testid="User-Name"]'
card_wrapper = '[data-testid="card.wrapper"]'
quote_tweet = '[data-testid="quoteTweet"]'
promoted = '[data-testid="placementTracking"]'
next_button = '[data-testid="nextButton"]'
logged_in_marker = 'a[data-testid="AppTabBar_Home_Link"], [data-testid="SideNav_AccountSwitcher_Button"], [data-testid="SideNav_NewTweetButton"], [data-testid="AppTabBar_Profile_Link"]'
home_tab = 'a[data-testid="AppTabBar_Home_Link"]'
show_more_replies = '[data-testid="showMoreReplies"]'
reply_button = '[data-testid="reply"]'
composer = '[data-testid="tweetTextarea_0"]'
tweet_reply = 'article[data-testid="tweet"]'
error_state = '[data-testid="errorDetail"]'