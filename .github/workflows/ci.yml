name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: the code uses tomllib.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # requirements-dev.txt pulls in requirements.txt. Playwright is installed
        # so the import graph matches a real environment; the tests never launch
        # a browser and never touch the network.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Offline scorer self-check
        # Fails the build if the scorer regresses on the synthetic corpora.
        run: python tests/test_corpus.py

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: these are the files that must never contain a secret
          # or a real identity, and they have to be checked at every revision.
          fetch-depth: 0

      - name: No secrets in the tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: config.toml must not be tracked
        # It holds the user's identity by design; only the placeholder template
        # belongs in the repo.
        run: |
          if git ls-files --error-unmatch config.toml >/dev/null 2>&1; then
            echo "config.toml is tracked - it holds the user's identity and must be gitignored"
            exit 1
          fi

      - name: Runtime output must not be tracked
        run: |
          tracked=$(git ls-files -- '*.jsonl' 'seen.json' 'logs/' '*_and_hackathons.md' 'hackathons.md')
          if [ -n "$tracked" ]; then
            echo "runtime output is tracked:"
            echo "$tracked"
            exit 1
          fi